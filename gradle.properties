org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ============================================================
# 版本号单一来源（app/build.gradle.kts 与 build_apk.sh 共同读取）
# 默认走「提交数驱动」自动递增；VERSION_CODE/VERSION_NAME 可显式覆盖发版。
# 背景：仓库经多次 filter-repo 瘦身，每次提交数重置后需同步调整下述偏移。
# 当前 BASE=5 对应 15 commits → v3.1.0，每 +1 commit 自动递增 patch 号。
# 请勿在无明确升级规划时改动。
# ============================================================
VERSION_BASE_COMMIT=5
VERSION_MAJOR_BASE=3
VERSION_CODE_OFFSET=186
