name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # secrets 不能直接用于 step 的 if，先桥接到 job 级 env，再用 env 判断是否配置了发布令牌。
    # XCCAPK：对公开分发仓库 qfwc258/xccapk 具备 Contents 写权限的令牌。
    env:
      XCCAPK_TOKEN: ${{ secrets.XCCAPK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须为 0（完整历史）：versionCode / versionName 由 `git rev-list --count HEAD`
          # 推导，浅克隆会让提交数恒为 1，导致版本号与 versionCode 回退。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "Android SDK setup complete"

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > mdgw-release.jks

      - name: Setup signing config
        run: |
          cat > signing.properties << 'EOF'
          storeFile=mdgw-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 纯 JVM 单元测试（docx / OOXML / PPTX 引擎回归）。放在打包之前：
      # 用例失败即中断，不会产出带回归的 Release APK。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -PstoreFile=mdgw-release.jks -PstorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" -PkeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" -PkeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" -PstoreType=PKCS12

      - name: Get version and rename APK
        id: version_info
        run: |
          set -e
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # output-metadata.json 的 key 带引号（"versionName": "x.y.z"），正则必须匹配引号
          VERSION_NAME=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' app/build/outputs/apk/release/output-metadata.json | head -1)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::无法从 output-metadata.json 读取 versionName"
            exit 1
          fi
          # 统一命名 chenlv-toolbox-<版本>.apk，发布到公开分发仓库 xccapk
          APK_NEW_NAME="chenlv-toolbox-${VERSION_NAME}.apk"
          mkdir -p release-out
          cp "$APK_PATH" "release-out/${APK_NEW_NAME}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "apk_path=release-out/${APK_NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chenlv-toolbox-apk
          path: ${{ steps.version_info.outputs.apk_path }}
          retention-days: 30

      - name: Publish APK to source repo (chenlv-toolbox)
        # 在源码仓自身也保留一份 Release，作为 xccapk 之外的冗余备份。
        # 使用 Actions 自带的 GITHUB_TOKEN（本仓 contents 写权限），无需额外密钥。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_info.outputs.version_name }}
          name: 陈律工具箱 v${{ steps.version_info.outputs.version_name }}（源码仓备份）
          body: |
            ## 陈律工具箱 自动构建（源码仓冗余备份）

            - Word / PPTX / PDF / 公众号排版，法援目录与证据目录填报
            - 法律查询（国家法规库 OFD 阅读器自适应手机）
            - 工伤赔偿计算（湖南标准，残疾/死亡双模式）
            - 生成文书（按模板批量替换）、FTP 传文件、应用内检查更新

            本 Release 为源码仓备份，正式更新分发见 qfwc258/xccapk。
          files: ${{ steps.version_info.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to xccapk
        # 跨仓发布到公开的 APK 分发仓库；需在本仓库 Settings→Secrets→Actions 配置
        # 名为 XCCAPK 的密钥（对 qfwc258/xccapk 有 Contents 写权限）。未配置时跳过。
        # 独立容错：即便 xccapk 发布失败，上一步源码仓 Release 已保留 APK，不拖红整次构建。
        if: ${{ env.XCCAPK_TOKEN != '' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: qfwc258/xccapk
          tag_name: chenlv-toolbox-v${{ steps.version_info.outputs.version_name }}
          name: 陈律工具箱 v${{ steps.version_info.outputs.version_name }}
          body: |
            ## 陈律工具箱 自动构建

            - Word / PPTX / PDF / 公众号排版，法援目录与证据目录填报
            - 法律查询（国家法规库 OFD 阅读器自适应手机）
            - 工伤赔偿计算（湖南标准，残疾/死亡双模式）
            - 生成文书（按模板批量替换）、FTP 传文件、应用内检查更新
          files: ${{ steps.version_info.outputs.apk_path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ env.XCCAPK_TOKEN }}
