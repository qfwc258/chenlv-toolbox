name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options:
          - 'draft'
          - 'published'
      notes:
        description: 'Release notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须为 0（完整历史）：versionCode / versionName 由 `git rev-list --count HEAD`
          # 推导，浅克隆会让提交数恒为 1，导致版本号与 versionCode 回退。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          echo "Android SDK setup complete"

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > mdgw-release.jks

      - name: Setup signing config
        run: |
          cat > signing.properties << 'EOF'
          storeFile=mdgw-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 纯 JVM 单元测试（docx / OOXML / PPTX 引擎回归）。放在打包之前：
      # 用例失败即中断，不会产出带回归的 Release APK。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -PstoreFile=mdgw-release.jks -PstorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" -PkeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" -PkeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" -PstoreType=PKCS12

      - name: Get version and rename APK
        id: version_info
        run: |
          set -e
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # output-metadata.json 的 key 带引号（"versionName": "x.y.z"），正则必须匹配引号
          VERSION_NAME=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' app/build/outputs/apk/release/output-metadata.json | head -1)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::无法从 output-metadata.json 读取 versionName"
            exit 1
          fi
          APK_NEW_NAME="chenlv-toolbox-v${VERSION_NAME}-${SHORT_SHA}.apk"
          mkdir -p release-out
          cp "$APK_PATH" "release-out/${APK_NEW_NAME}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "apk_path=release-out/${APK_NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chenlv-toolbox-apk
          path: ${{ steps.version_info.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_info.outputs.version_name }}-${{ steps.version_info.outputs.short_sha }}
          name: 陈律工具箱 v${{ steps.version_info.outputs.version_name }}
          body: |
            ## 更新日志
            
            - 版本：${{ steps.version_info.outputs.version_name }}
            - 提交：${{ steps.version_info.outputs.short_sha }}
            - 提交数：${{ steps.version_info.outputs.commit_count }}
            
            ${{ github.event.inputs.notes || '自动构建版本' }}
            
            ## 下载
            
            - 下载下方 Assets 中的 `chenlv-toolbox-v<版本>-<提交>.apk`
          files: ${{ steps.version_info.outputs.apk_path }}
          draft: ${{ github.event.inputs.release_type == 'draft' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
